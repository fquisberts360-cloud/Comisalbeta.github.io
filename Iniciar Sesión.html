<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Comisal</title>
    <link rel="stylesheet" href="CSS/Style6.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="imagenes/Recursos Comisal/Logo/WhatsApp Image 2026-04-23 at 11.57.50 AM-Photoroom (1).png" alt="Comisal Logo">
        </div>
        <button class="menu-toggle" id="mobile-menu-btn">☰</button>
        <nav id="nav-menu">
            <a href="index.Html">Inicio</a>
            <a href="Servicios.html">Servicios</a>
            <a href="Novedades.html">Novedades</a>
            <a href="Acerca de.html">Acerca de</a>
            <a href="Contactos.html">Contactos</a>
            <a href="Iniciar Sesión.html"> <button class="btn">Iniciar Sesión</button> </a>
        </nav>
    </header>

    <main class="login-wrapper">
        <section class="login-card">
            <h1>Iniciar Sesión</h1>
            <form>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="Correo Electrónico">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="Contraseña">
                </div>
                <a href="#" class="forgot-password">¿Olvidaste tu Contraseña?</a>
                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-left">
            <h4>Ubicaciones</h4>
            <p>La Paz, Zona Sur, Calacoto, Avenida Julio Patiño Calle 17, N°1089</p>
            <p>Ubicación en Tupiza</p>
        </div>
        <div class="footer-right">
            <h4>Contáctanos Aquí</h4>
            <a href="Contactos.html"><button class="btn" style="background-color: var(--white); color: var(--primary-blue);">Ver contactos</button></a>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const navMenu = document.getElementById('nav-menu');
        menuBtn.addEventListener('click', () => { navMenu.classList.toggle('active'); });
    </script>
</body>
</html>
